<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Limbus Company: Ignavus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-nav">
    <a class="site-nav-brand display" href="index.html">Limbus Company: Ignavus</a>
    <div id="nav-account" class="site-nav-account"></div>
  </header>

  <section class="page">
    <h1 class="page-title display">Login</h1>

    <div class="auth-card">
      <div id="auth-form-wrap">
        <form id="auth-form">
          <div class="auth-field">
            <label for="auth-email">Email</label>
            <input id="auth-email" type="email" autocomplete="email" required>
          </div>
          <div class="auth-field">
            <label for="auth-password">Password</label>
            <input id="auth-password" type="password" autocomplete="current-password" required minlength="6">
          </div>
          <button id="auth-submit" class="auth-submit" type="submit">Log In</button>
        </form>
        <button id="auth-toggle" class="auth-toggle" type="button">Need an account? Sign up</button>
        <p id="auth-message" class="auth-message" role="status"></p>
      </div>

      <div id="auth-signed-in" class="auth-signed-in" style="display: none;">
        <p class="credits-role">Signed in as</p>
        <p id="auth-signed-in-email" class="auth-email"></p>
        <button id="auth-signout" class="auth-submit" type="button">Sign Out</button>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
