<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Sheet — Limbus Company: Ignavus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-nav">
    <a class="site-nav-brand display" href="index.html"><span class="accent-yellow">Limbus Company</span>: <span class="accent">Ignavus</span></a>
    <div id="nav-account" class="site-nav-account"></div>
  </header>

  <div id="sheet-page" class="sheet-page">
    <p id="sheet-loading" class="page-note">Loading character…</p>
  </div>

  <template id="sheet-template">
    <div class="sheet-header-row">
      <div class="sheet-header-text">
        <h1 id="sheet-name" class="sheet-name display"></h1>
        <p id="sheet-district" class="sheet-meta"></p>
      </div>
      <button id="sheet-portrait-btn" class="sheet-portrait-btn" type="button" aria-label="Upload a portrait">👤</button>
    </div>

    <div class="sheet-tabs" role="tablist">
      <button id="tab-btn-innocence" class="sheet-tab is-active" type="button" role="tab" aria-selected="true">Innocence</button>
      <button id="tab-btn-ego" class="sheet-tab" type="button" role="tab" aria-selected="false">E.G.O</button>
    </div>

    <div id="tab-innocence">

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Vitals</h2>
      <div class="vitals">
        <div class="vitals-bars">
          <div class="vital-block">
            <div class="vital-row">
              <span class="vital-label display">HP</span>
              <div class="vital-bar-track"><div id="sheet-hp-bar" class="vital-bar-fill vital-hp" style="width: 100%;"></div></div>
              <span id="sheet-hp-text" class="vital-text"></span>
            </div>
            <div id="hp-dm-controls" class="vital-dm" style="display: none;">
              <input id="hp-amount" type="number" min="1" value="1" aria-label="HP amount">
              <button id="hp-hurt" class="small-btn" type="button">Hurt</button>
              <button id="hp-heal" class="small-btn" type="button">Heal</button>
              <span id="hp-status" class="save-status"></span>
            </div>
          </div>
          <div class="vital-block">
            <div class="vital-row">
              <span class="vital-label display">SP</span>
              <div class="vital-bar-track"><div id="sheet-sp-bar" class="vital-bar-fill vital-sp" style="width: 100%;"></div></div>
              <span id="sheet-sp-text" class="vital-text"></span>
            </div>
            <div id="sp-dm-controls" class="vital-dm" style="display: none;">
              <input id="sp-amount" type="number" min="1" value="1" aria-label="SP amount">
              <button id="sp-hurt" class="small-btn" type="button">Hurt</button>
              <button id="sp-heal" class="small-btn" type="button">Heal</button>
              <span id="sp-status" class="save-status"></span>
            </div>
          </div>
        </div>
        <div class="speed-box" title="Tiles you can move in any direction">
          <span class="speed-label display">Speed</span>
          <span id="sheet-speed" class="speed-value">1</span>
          <span class="speed-unit">tiles, any direction</span>
        </div>
      </div>
    </div>

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Level &amp; Experience</h2>
      <div class="level-row">
        <span class="display">Level</span>
        <span id="sheet-level" class="level-value">1</span>
      </div>
      <div class="xp-bar-track">
        <div id="sheet-xp-bar" class="xp-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="xp-edit-controls" class="xp-controls" style="display: none;">
        <label for="sheet-xp-input">XP</label>
        <input id="sheet-xp-input" type="number" min="0" max="100" value="0">
        <button id="sheet-xp-save" class="small-btn" type="button">Save XP</button>
        <span id="sheet-xp-status" class="save-status"></span>
      </div>
    </div>

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Classification</h2>
      <div id="classification-ladder" class="classification-ladder"></div>
      <div id="classification-dm-controls" class="classification-dm-controls" style="display: none;">
        <button id="classification-back" class="small-btn" type="button">← Regress</button>
        <button id="classification-forward" class="small-btn" type="button">Advance →</button>
        <span id="classification-status" class="save-status"></span>
      </div>
    </div>

    <div class="sheet-section sheet-stats">
      <h2 class="sheet-section-title display">Stats</h2>

      <div class="stat-card">
        <div class="stat-row" style="--stat-color: var(--stat-fortitude);">
          <span class="stat-name display">Fortitude</span>
          <span class="stat-value" id="sheet-stat-fortitude"></span>
          <span class="stat-descriptor" id="sheet-descriptor-fortitude"></span>
        </div>
        <div class="skills-list" id="sheet-skills-fortitude"></div>
      </div>

      <div class="stat-card">
        <div class="stat-row" style="--stat-color: var(--stat-prudence);">
          <span class="stat-name display">Prudence</span>
          <span class="stat-value" id="sheet-stat-prudence"></span>
          <span class="stat-descriptor" id="sheet-descriptor-prudence"></span>
        </div>
        <div class="skills-list" id="sheet-skills-prudence"></div>
      </div>

      <div class="stat-card">
        <div class="stat-row" style="--stat-color: var(--stat-temperance);">
          <span class="stat-name display">Temperance</span>
          <span class="stat-value" id="sheet-stat-temperance"></span>
          <span class="stat-descriptor" id="sheet-descriptor-temperance"></span>
        </div>
        <div class="skills-list" id="sheet-skills-temperance"></div>
      </div>

      <div class="stat-card">
        <div class="stat-row" style="--stat-color: var(--stat-justice);">
          <span class="stat-name display">Justice</span>
          <span class="stat-value" id="sheet-stat-justice"></span>
          <span class="stat-descriptor" id="sheet-descriptor-justice"></span>
        </div>
        <div class="skills-list" id="sheet-skills-justice"></div>
      </div>
    </div>

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Inventory</h2>
      <div id="inventory-grid" class="inventory-grid"></div>
      <p id="inventory-status" class="save-status"></p>
      <div id="item-detail-panel" class="item-detail-panel" style="display: none;">
        <p id="item-detail-name" class="item-detail-name display"></p>
        <p id="item-detail-type" class="item-detail-type"></p>
        <div id="container-contents-section" class="container-contents-section" style="display: none;">
          <h3 class="container-contents-title display">Contents <span id="container-contents-count"></span></h3>
          <div id="container-contents-list" class="container-contents-list"></div>
          <p class="creator-note">Drag an item onto this container in the grid to store it. Drag an item here onto the grid to take it out, or use its "Take Out" button.</p>
        </div>
        <div id="item-name-row" class="item-name-row">
          <label for="item-name-input">Name</label>
          <input id="item-name-input" type="text" maxlength="40" class="item-name-input">
          <button id="item-name-save" class="small-btn" type="button">Save Name</button>
          <span id="item-name-status" class="save-status"></span>
        </div>
        <div id="item-money-row" class="money-row" style="display: none;">
          <label for="item-money-input">Money</label>
          <input id="item-money-input" type="number" min="0" step="1">
          <button id="item-money-save" class="small-btn" type="button">Save</button>
          <span id="item-money-status" class="save-status"></span>
        </div>
        <div class="item-description-row">
          <label for="item-description-input">Description</label>
          <textarea id="item-description-input" class="sheet-textarea item-description-textarea"></textarea>
          <div class="save-row">
            <button id="item-description-save" class="small-btn" type="button">Save Description</button>
            <span id="item-description-status" class="save-status"></span>
          </div>
        </div>
        <div id="weapon-skills-section" class="weapon-skills-section" style="display: none;">
          <div class="weapon-skills-header">
            <h3 class="weapon-skills-title display">Skills <span id="weapon-skills-count"></span></h3>
            <span id="weapon-skill-status" class="save-status"></span>
            <button id="weapon-skill-add" class="small-btn" type="button">+ New Skill</button>
          </div>
          <div id="weapon-skill-grid" class="ruina-card-grid"></div>
          <div id="weapon-skill-editor" class="skill-editor" style="display: none;"></div>
        </div>
      </div>
    </div>

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Panic Type</h2>
      <div class="panic-card">
        <p id="panic-name" class="panic-name display"></p>
        <p id="panic-description" class="panic-description"></p>
      </div>
    </div>

    <div class="story-zone">

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Story</h2>
      <textarea id="sheet-story" class="sheet-textarea"></textarea>
      <div class="save-row">
        <button id="sheet-story-save" class="small-btn" type="button">Save Story</button>
        <span id="sheet-story-status" class="save-status"></span>
      </div>
    </div>

    <div class="sheet-section">
      <h2 class="sheet-section-title display">Notes</h2>
      <textarea id="sheet-notes" class="sheet-textarea"></textarea>
      <div class="save-row">
        <button id="sheet-notes-save" class="small-btn" type="button">Save Notes</button>
        <span id="sheet-notes-status" class="save-status"></span>
      </div>
    </div>
    </div>
    </div>

    <div id="tab-ego" style="display: none;">
      <div class="sheet-section">
        <h2 class="sheet-section-title display">E.G.O</h2>
        <div class="ego-header">
          <span id="ego-slots-summary" class="ego-slots-summary"></span>
          <button id="ego-remove-slot" class="small-btn" type="button" style="display: none;">− Remove Slot</button>
          <button id="ego-add-slot" class="small-btn" type="button" style="display: none;">+ Add Slot</button>
          <span id="ego-slot-status" class="save-status"></span>
        </div>
        <div id="ego-slot-list" class="ego-slot-list"></div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/skills-data.js"></script>
  <script src="js/weapon-skills.js"></script>
  <script src="js/character-sheet.js"></script>
</body>
</html>
