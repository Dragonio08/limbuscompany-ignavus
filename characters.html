<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters — Limbus Company: Ignavus</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-nav">
    <a class="site-nav-brand display" href="index.html"><span class="accent-yellow">Limbus Company</span>: <span class="accent">Ignavus</span></a>
    <div id="nav-account" class="site-nav-account"></div>
  </header>

  <div class="chars-page">
    <div class="chars-header">
      <h1 id="chars-title" class="chars-title display">Characters</h1>
      <button id="new-character-btn" class="new-character-btn display" type="button">Make new +</button>
    </div>

    <div class="sheet-tabs chars-tabs" role="tablist">
      <button id="tab-btn-mine" class="sheet-tab is-active" type="button" role="tab" aria-selected="true">Characters</button>
      <button id="tab-btn-users" class="sheet-tab" type="button" role="tab" aria-selected="false">User's Characters</button>
      <button id="tab-btn-npcs" class="sheet-tab" type="button" role="tab" aria-selected="false" style="display: none;">NPCs</button>
    </div>

    <div id="tab-mine" class="chars-tab-panel">
      <div id="chars-scroll-box" class="chars-scroll-box"></div>
    </div>

    <div id="tab-users" class="chars-tab-panel" style="display: none;">
      <div id="users-scroll-box" class="chars-scroll-box"></div>
    </div>

    <div id="tab-npcs" class="chars-tab-panel" style="display: none;">
      <div id="npcs-scroll-box" class="chars-scroll-box"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/characters.js"></script>
</body>
</html>
